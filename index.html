<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05040c" />
    <meta name="description" content="A neon snake game: classic grid rules, smooth motion, combos and golden food." />
    <title>Snake</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main class="shell">
      <header class="hud">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="combo" id="combo">
          <span class="combo-label">Combo</span>
          <span class="combo-mult" id="combo-mult">×2</span>
          <span class="combo-meter"><span class="combo-fill" id="combo-fill"></span></span>
        </div>
        <div class="stat stat-right">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
      </header>

      <section class="stage" id="stage" aria-label="Arena">
        <div class="overlay title" id="title">
          <h1 class="neon-title">Snake</h1>
          <p class="prompt" id="title-prompt"></p>
        </div>

        <div class="overlay hint" id="hint">
          <p class="prompt" id="hint-prompt"></p>
        </div>

        <div class="overlay" id="paused">
          <div class="panel">
            <h2 class="neon">Paused</h2>
            <p class="prompt" id="paused-prompt"></p>
          </div>
        </div>

        <div class="overlay over" id="over" aria-live="polite">
          <div class="panel">
            <h2 class="neon" id="over-title">Game over</h2>
            <p class="new-best">New high score!</p>
            <p class="final-score" id="over-score">0</p>
            <dl class="stats">
              <div><dt>Length</dt><dd id="over-length">3</dd></div>
              <div><dt>Best combo</dt><dd id="over-combo">×1</dd></div>
              <div><dt>Golden</dt><dd id="over-golden">0</dd></div>
            </dl>
            <p class="prompt again" id="over-prompt"></p>
          </div>
        </div>
      </section>

      <footer class="bar">
        <p class="controls" id="controls"></p>
        <div class="buttons">
          <button id="pause-btn" type="button" aria-label="Pause">
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" /></svg>
          </button>
          <button id="mute-btn" type="button" aria-label="Mute">
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" /><path d="M16 9.5l5 5M21 9.5l-5 5" />
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </body>
</html>
